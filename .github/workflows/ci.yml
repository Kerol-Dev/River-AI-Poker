name: Validate River
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Windows checkouts use CRLF line endings, so formatting is checked elsewhere.
      - if: runner.os != 'Windows'
        run: npm run format:check
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npm run build:ocr && npm run test:ocr
      - if: runner.os == 'Windows'
        run: npm run test:ocr:windows
      - run: npm run release:check
