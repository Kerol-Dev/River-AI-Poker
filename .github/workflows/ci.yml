name: Validate River
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npm run build:ocr && npm run test:ocr
      - run: npm run release:check
