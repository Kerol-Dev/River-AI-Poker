<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>River synthetic reader test</title>
    <style>
      body {
        background: #f4ede0;
        color: #1c1b1a;
        font: 16px system-ui;
        padding: 40px;
        margin: 0;
      }
      h1 {
        font-size: 30px;
      }
      .notice {
        font-weight: 800;
        color: #a43e35;
      }
      .table {
        max-width: 650px;
        margin-top: 35px;
        background: #1c1b1a;
        color: #f4ede0;
        padding: 30px;
        border-radius: 18px;
      }
      .table-area {
        position: relative;
        min-height: 260px;
      }
      .player-area {
        padding: 15px;
        background: #39332d;
        margin-bottom: 10px;
      }
      .cards-holder-hero,
      .community-cards {
        display: flex;
        gap: 8px;
        margin: 15px 0;
      }
      .card-wrapper {
        background: #f4ede0;
        color: #1c1b1a;
        border-radius: 5px;
        padding: 8px;
        width: 35px;
        height: 45px;
        display: flex;
        gap: 5px;
      }
      .card-rank,
      .card-suit {
        display: inline-block;
        min-width: 12px;
      }
      .pt-visibility-hidden {
        visibility: hidden;
      }
      .player-seat-1 .cards-holder-other-hidden {
        display: flex;
        gap: 5px;
      }
      .player-seat-1 .card-wrapper {
        background: #65594d;
        width: 20px;
        height: 20px;
      }
      .total-pot {
        padding: 10px;
      }
      .action-button {
        display: inline-block;
        background: #ff6b5b;
        color: #1c1b1a;
        font-weight: 800;
        padding: 15px;
        margin: 8px;
        cursor: pointer;
        border-radius: 8px;
      }
      #result {
        font-weight: 850;
        font-size: 23px;
        padding: 20px 0;
      }
      #result small {
        font-size: 13px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <h1>River · sample table</h1>
    <p class="notice">SYNTHETIC TABLE · FAKE CHIPS · NO NETWORK OR WAGERS</p>
    <button id="toggle-turn">Show opponent turn</button>
    <button id="raise-guidance">Use raise guidance</button>
    <div id="result">0 actions received</div>
    <div class="hand-id">#123456789</div>
    <div class="table">
      <div class="table-area">
        <div class="player-area player-seat-1">
          <div class="player-nameplate">Player 1 €10.00</div>
          <div class="cards-holder-other-hidden">
            <div class="card-wrapper"></div>
            <div class="card-wrapper"></div>
          </div>
        </div>
        <div class="player-area player-seat-3 my-player">
          <div class="player-nameplate">You €10.00</div>
          <div class="cards-holder-hero">
            <div class="card-wrapper">
              <span class="card-rank">10</span><span class="card-suit">♥</span>
            </div>
            <div class="card-wrapper">
              <span class="card-rank">7</span><span class="card-suit">♠</span>
            </div>
          </div>
        </div>
        <div class="bet player-bet-3 pt-visibility-hidden"></div>
        <div class="total-pot">Pot: €1.00</div>
        <div class="community-cards">
          <div class="card-wrapper">
            <span class="card-rank">K</span><span class="card-suit">♦</span>
          </div>
          <div class="card-wrapper">
            <span class="card-rank">Q</span><span class="card-suit">♣</span>
          </div>
          <div class="card-wrapper">
            <span class="card-rank">2</span><span class="card-suit">♥</span>
          </div>
        </div>
        <div class="game-position game-position-1"><div class="dealer">D</div></div>
      </div>
      <div class="table-actions-wrapper">
        <label>Raise amount<input class="betting-input" value="€0.24" /></label>
        <div class="actions-area single-actions">
          <div class="base-button action-button">Fold</div>
          <div class="base-button action-button">Call €0.12</div>
          <div class="base-button action-button">Raise To €0.24</div>
        </div>
      </div>
    </div>
    <script>
      let clickCount = 0,
        graphReset = false,
        raiseGuidance = false;
      const start = Date.now() - 3600000;
      const points = [0, 60, 20, 180, 135, 260, 245, 410, 330, 520, 480, 640, 585].map(
        (net, i) => ({ at: start + i * 300000, net }),
      );
      const performance = {
        currency: '€',
        net: 585,
        start,
        count: 12,
        points,
        ten: points
          .filter((p, i) => i % 2 === 0)
          .slice(1)
          .map((p, i) => ({ ...p, delta: p.net - points[i * 2].net })),
        hour: [{ at: start, net: 585, delta: 585 }],
      };
      const panel = (s) => ({
        at: Date.now(),
        key: s.key,
        win: 0.59,
        tie: 0.04,
        equity: 0.61,
        manualRaise: raiseGuidance
          ? { target: 0.78, note: 'Manual size: 50% of the pot after calling.' }
          : null,
        hole: ['Th', '7s'],
        board: ['Kd', 'Qc', '2h'],
        performance: graphReset ? undefined : performance,
        profiles: [
          {
            name: 'Atlas (demo)',
            hands: 44,
            actions: 105,
            bets: 18,
            raises: 10,
            foldedFacing: 22,
            faced: 35,
            range: 'Unknown until 30 priced preflop decisions',
            riverBluffCandidates: 1,
          },
        ],
        events: [{ name: 'Atlas (demo)', action: 'raise', hand: s.handId }],
        reasoning: [
          'Synthetic preview. All amounts are fake chips.',
          'Call €0.12 into €1.00 requires 10.7% equity.',
        ],
        intent: 'call',
      });

      document.querySelector('#raise-guidance').onclick = () => {
        raiseGuidance = !raiseGuidance;
        document.querySelector('#raise-guidance').textContent = raiseGuidance
          ? 'Use call guidance'
          : 'Use raise guidance';
      };
      const amountInput = document.querySelector('.betting-input');
      let entered = null;
      amountInput.addEventListener('focus', () => {
        amountInput.value = amountInput.value.replace('€', '');
      });
      amountInput.addEventListener('input', () => {
        entered = /^\d+\.\d{2}$/.test(amountInput.value) ? Number(amountInput.value) : null;
      });
      amountInput.addEventListener('blur', () => {
        if (entered !== null) {
          document.querySelectorAll('.action-button')[2].textContent =
            'Raise To €' + entered.toFixed(2);
          amountInput.value = '€' + entered.toFixed(2);
        }
      });
      document.querySelector('#toggle-turn').onclick = () => {
        const actions = document.querySelector('.single-actions');
        actions.style.display = actions.style.display === 'none' ? '' : 'none';
        document.querySelector('#toggle-turn').textContent =
          actions.style.display === 'none' ? 'Show my turn' : 'Show opponent turn';
      };
      document.querySelectorAll('.action-button').forEach((button) =>
        button.addEventListener('click', () => {
          clickCount++;
          document.querySelector('#result').textContent =
            clickCount + ' action received: ' + button.textContent;
          document.querySelector('.single-actions').style.display = 'none';
        }),
      );
      window.chrome = {
        storage: { onChanged: { addListener() {} } },
        runtime: {
          async sendMessage(m) {
            if (m.type === 'settings') return { paired: true, enabled: true, profile: null };
            if (m.type === 'reset-session') {
              graphReset = true;
              return { ok: true };
            }
            if (m.type === 'snapshot') {
              const s = m.snapshot;
              return {
                ok: true,
                panel: panel(s),
                decision:
                  s.errors.length || !s.heroTurn
                    ? null
                    : {
                        key: s.key,
                        action: raiseGuidance ? 'Raise' : 'Call',
                        target: raiseGuidance ? 0.68 : undefined,
                        amount: raiseGuidance ? 0.68 : s.call,
                        equity: 0.61,
                        threshold: 0.107,
                        explanation: 'Synthetic test decision. No real wager is possible.',
                        updatedAt: Date.now(),
                      },
              };
            }
            return { ok: true };
          },
        },
      };
    </script>
    <script src="../browser-extension/adapter.js"></script>
    <script src="../browser-extension/bet-sizing.js"></script>
    <script src="../browser-extension/autoplay.js"></script>
    <script src="../browser-extension/theme.js"></script>
    <script src="../browser-extension/interface.js"></script>
    <script src="../browser-extension/panel.js"></script>
    <script src="../browser-extension/content.js"></script>
  </body>
</html>
